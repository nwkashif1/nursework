name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir -p www
          cp nursework.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "nursework-pro",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "nursework-steps": "file:plugins/nursework-steps"
            },
            "devDependencies": { "@capacitor/cli": "^6.0.0" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          { "appId": "com.nursework.pro", "appName": "NurseWork Pro", "webDir": "www" }
          EOF
          mkdir -p plugins/nursework-steps
          cat > plugins/nursework-steps/package.json <<'EOF'
          {
            "name": "nursework-steps",
            "version": "1.0.0",
            "description": "Native step counter for NurseWork Pro",
            "files": ["android/"],
            "capacitor": { "android": { "src": "android" } },
            "peerDependencies": { "@capacitor/core": ">=6.0.0" }
          }
          EOF
          mkdir -p plugins/nursework-steps/android
          cat > plugins/nursework-steps/android/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
          }
          apply plugin: 'com.android.library'
          android {
              namespace "com.nursework.steps"
              compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
              defaultConfig {
                  minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
                  targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              lintOptions { abortOnError false }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          repositories { google(); mavenCentral() }
          dependencies { implementation project(':capacitor-android') }
          EOF
          mkdir -p plugins/nursework-steps/android/src/main
          cat > plugins/nursework-steps/android/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-feature android:name="android.hardware.sensor.stepcounter" android:required="false" />
          </manifest>
          EOF
          mkdir -p plugins/nursework-steps/android/src/main/java/com/nursework/steps
          cat > plugins/nursework-steps/android/src/main/java/com/nursework/steps/StepsPlugin.java <<'EOF'
          package com.nursework.steps;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          @CapacitorPlugin(
              name = "Steps",
              permissions = { @Permission(alias = "activity", strings = { Manifest.permission.ACTIVITY_RECOGNITION }) }
          )
          public class StepsPlugin extends Plugin implements SensorEventListener {

              private SensorManager sm;
              private Sensor sensor;
              private boolean running = false;
              private int lastToday = 0;

              private boolean granted() {
                  return Build.VERSION.SDK_INT < 29 || getPermissionState("activity") == PermissionState.GRANTED;
              }

              private Sensor stepSensor() {
                  if (sm == null) sm = (SensorManager) getContext().getSystemService(Context.SENSOR_SERVICE);
                  return sm == null ? null : sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER);
              }

              @PluginMethod
              public void checkPermission(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", granted());
                  r.put("hasSensor", stepSensor() != null);
                  call.resolve(r);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  if (granted()) {
                      checkPermission(call);
                      return;
                  }
                  requestPermissionForAlias("activity", call, "permCallback");
              }

              @PermissionCallback
              private void permCallback(PluginCall call) {
                  checkPermission(call);
              }

              @PluginMethod
              public void start(PluginCall call) {
                  if (!granted()) {
                      call.reject("permission");
                      return;
                  }
                  sensor = stepSensor();
                  if (sensor == null) {
                      call.reject("nosensor");
                      return;
                  }
                  if (!running) {
                      sm.registerListener(this, sensor, SensorManager.SENSOR_DELAY_UI);
                      running = true;
                  }
                  SharedPreferences p = getContext().getSharedPreferences("nw_steps", Context.MODE_PRIVATE);
                  String d = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                  int today = d.equals(p.getString("date", "")) ? p.getInt("last", 0) : 0;
                  lastToday = today;
                  JSObject r = new JSObject();
                  r.put("steps", today);
                  call.resolve(r);
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  if (running && sm != null) sm.unregisterListener(this);
                  running = false;
                  call.resolve();
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  i.setData(Uri.fromParts("package", getContext().getPackageName(), null));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  float total = e.values[0];
                  SharedPreferences p = getContext().getSharedPreferences("nw_steps", Context.MODE_PRIVATE);
                  String d = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                  String sd = p.getString("date", "");
                  float base = p.getFloat("base", -1f);
                  int carry = p.getInt("carry", 0);
                  int last = p.getInt("last", 0);
                  if (!d.equals(sd) || base < 0) {
                      base = total;
                      carry = 0;
                      last = 0;
                  } else if (total < base) {
                      // phone restarted: sensor counter reset to 0
                      carry = last;
                      base = 0;
                  }
                  int today = carry + (int) (total - base);
                  p.edit().putString("date", d).putFloat("base", base).putInt("carry", carry).putInt("last", today).apply();
                  if (today != lastToday) {
                      lastToday = today;
                      JSObject r = new JSObject();
                      r.put("steps", today);
                      notifyListeners("steps", r);
                  }
              }

              @Override
              public void onAccuracyChanged(Sensor s, int a) {}

              @Override
              protected void handleOnDestroy() {
                  if (running && sm != null) sm.unregisterListener(this);
                  running = false;
              }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NurseWork-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
